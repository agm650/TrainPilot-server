global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - trainpilot-soak-recording-rules.yml
  - trainpilot-soak-alerting-rules.yml

scrape_configs:
  - job_name: trainpilot
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.2.2:6060
        labels:
          environment: benchmark

  - job_name: trainpilot-bench
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.2.1:6061
        labels:
          environment: benchmark

  - job_name: node
    static_configs:
      - targets:
          - 192.168.2.2:9100
        labels:
          environment: benchmark
