global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - trainpilot-soak-recording-rules.yml
  - trainpilot-soak-alerting-rules.yml

scrape_configs:
  - job_name: trainpilot
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.0.60:6060
          - 192.168.0.54:6060
        labels:
          environment: benchmark

  - job_name: trainpilot-bench
    metrics_path: /metrics
    static_configs:
      - targets:
          - 192.168.0.50:6061
        labels:
          environment: benchmark

  - job_name: node
    static_configs:
      - targets:
          - 192.168.0.60:9100
          - 192.168.0.54:9100
        labels:
          environment: benchmark
