schema_version: 1
name: intermittent-fault-recovery-medium
warmup: 2m
duration: 10m
seed: 650
fixture: ../fixtures/medium/fixture.json
operation_timeout: 5s
clients: {users: 15, websockets: 15, active_locomotives: 10, workers: 32}
rates:
  login_per_second: 0.2
  refresh_per_second: 0.2
  lease_acquire_per_second: 0.5
  lease_heartbeat_per_second: 3
  lease_release_per_second: 0.5
  throttle_per_second: 15
  functions_per_second: 5
  feedback_per_second: 20
  accessories_per_second: 5
  route_operations_per_second: 2
  reads_per_second: 10
behavior: {reconnect_probability: 0.001, snapshot_probability: 0.001, drop_event_probability: 0.01}
expected_errors:
  - {operation: throttle, http_statuses: [500], from: 1m, to: 2m15s}
  - {operation: throttle, http_statuses: [500], from: 3m, to: 3m45s}
  - {operation: function, http_statuses: [500], from: 1m, to: 2m15s}
  - {operation: function, http_statuses: [500], from: 3m, to: 3m45s}
  - {operation: accessory, http_statuses: [409], from: 1m, to: 2m15s}
  - {operation: accessory, http_statuses: [409], from: 3m, to: 6m15s}
  - {operation: route, http_statuses: [409], from: 1m, to: 2m15s}
  - {operation: route, http_statuses: [409], from: 3m, to: 6m15s}
