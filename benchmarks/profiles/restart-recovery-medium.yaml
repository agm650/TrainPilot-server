schema_version: 1
name: restart-recovery-medium
warmup: 2m
duration: 10m
seed: 650
fixture: ../fixtures/medium/fixture.json
operation_timeout: 5s
clients: {users: 15, websockets: 15, active_locomotives: 10, workers: 32}
rates:
  login_per_second: 0.2
  refresh_per_second: 0.2
  lease_acquire_per_second: 0.5
  lease_heartbeat_per_second: 3
  lease_release_per_second: 0.5
  throttle_per_second: 15
