  - {operation: refresh, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: lease_acquire, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: lease_heartbeat, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: lease_release, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: throttle, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: function, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: feedback, kinds: [network, timeout], from: 3m, to: 4m}
  - {operation: accessory, kinds: [network, timeout], from: 3m, to: 4m}
